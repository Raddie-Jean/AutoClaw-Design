<script>
(()=>{
  const $=(q,root=document)=>root.querySelector(q);
  const $$=(q,root=document)=>[...root.querySelectorAll(q)];
  const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const defaults={title:'让每个想法更快成为产品',desc:'用 AI 协助团队从资料整理、界面探索到产品交付。',button:'申请体验',error:'请输入有效的工作邮箱',accent:'#292929',errorGap:3};
  const labels={title:'页面主标题',desc:'说明文案',button:'主按钮',error:'错误提示',accent:'品牌色',errorGap:'错误提示间距'};
  const state={reviewNotes:[],history:[],view:'collab',mode:'select',device:'desktop',formState:'error',previewEmail:'',selected:null,possible:[],base:{...defaults},candidate:null,candidateVisible:true,version:1,concept:false,demo:false,handed:false,messages:[],prompt:'',brush:null,mobile:'task',board:[{id:'home',x:24,y:24},{id:'preview',x:232,y:64},{id:'prd',x:64,y:240}],comments:[{role:'产品经理',text:'简化首屏说明，突出用户能完成什么。',version:1,target:'desc',value:'把想法变成可交付的产品，从第一张设计稿开始。',status:'待处理'},{role:'前端工程师',text:'错误提示紧跟输入框，并检查手机布局。',version:1,target:'error',value:'请填写有效的工作邮箱后再提交',status:'待处理'}],invited:[]};
  let toastTimer;
  function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,3100)}
  function displayData(){return state.candidate&&state.candidateVisible?state.candidate.data:state.base}
  function setView(view){state.view=view;render();if(window.innerWidth<=900){state.mobile='work';$('#app').className='app mobile-work';renderMobile()}}
  function renderMobile(){$$('[data-mobile]').forEach(b=>b.classList.toggle('active',b.dataset.mobile===state.mobile))}
  function render(){
    $$('[data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===state.view);b.setAttribute('aria-selected',b.dataset.view===state.view?'true':'false')});
    $$('[data-solution]').forEach(b=>b.classList.toggle('active',b.dataset.solution===(state.view==='collab'?'task2':'task1')));
    $$('.view').forEach(v=>v.classList.toggle('active',v.id==='view-'+state.view));
    renderStream();renderOverview();renderCanvas();renderFiles();renderVersions();renderCode();renderCollab();renderMobile();
  }
  function renderStream(){
 $('#stream').innerHTML=`<div class="date">测试2 · 独立协作评审任务</div><div class="bubble">邀请产品与前端同事评审首页 v1，建议固定在对应版本和对象上，由设计师决定是否采纳。</div><div class="agent"><div class="agent-title"><span class="agent-dot">A</span>协作助手</div><p>已准备独立的评审上下文。查看建议、确认对象，再决定是否创建修改候选。</p><div class="scope">任务：版本协作评审<br>基准：首页 v1 · 桌面 / 错误态<br>当前工作版：v${state.version}</div><p>此任务从已有设计版本开始，不包含测试1的需求生成与设计定稿流程。</p><button class="text-btn" data-action="open-collab">打开协作建议 →</button></div>${state.reviewNotes.map(t=>'<div class="bubble">'+escapeHTML(t)+'</div><div class="agent"><p>已保留本次评审说明。针对对象的修改请记录到右侧建议中。</p></div>').join('')}`;
 }
  const artifacts={home:{label:'首页 / index.html',type:'HTML',meta:'可运行主稿 · v1',action:'open-canvas'},preview:{label:'桌面预览.png',type:'PNG',meta:'派生预览 · 来自 v1',action:'open-canvas'},prd:{label:'产品需求 PRD.md',type:'MD',meta:'输入参考 · 只读',action:'board-info'},shot:{label:'视觉参考.png',type:'PNG',meta:'输入参考 · 只读',action:'board-info'},mobile:{label:'手机预览.png',type:'PNG',meta:'派生预览 · 来自 v1',action:'open-mobile'}};
  function boardCard(item){const a=artifacts[item.id];return `<div class="board-card ${a.action==='board-info'?'readonly':''}" draggable="true" data-board-id="${item.id}" style="left:${item.x}px;top:${item.y}px"><span class="stage-label">${a.type}</span><strong style="margin-top:10px">${a.label}</strong><span>${a.meta.replace('v1','v'+state.version)}</span><br><em>${a.action==='board-info'?'查看来源':'打开预览与编辑'} →</em></div>`}
  function renderOverview(){
    $('#view-overview').innerHTML=`<div class="overview-layout"><aside class="artifact-rail"><h3>本次任务的产物</h3><input id="artifact-search" aria-label="搜索产物" placeholder="搜索文件名或格式" style="width:100%;border:1px solid #e2e2e2;border-radius:7px;padding:8px;font-size:11px"><div class="group-title">可运行主稿</div><button class="artifact-row" draggable="true" data-artifact="home" data-action="open-canvas"><span class="file-icon">HTML</span><span><b>首页 / index.html</b><small>源文件 · v${state.version}</small></span></button><div class="group-title">派生预览</div><button class="artifact-row" draggable="true" data-artifact="preview" data-action="open-canvas"><span class="file-icon">PNG</span><span><b>桌面预览.png</b><small>来自当前工作版</small></span></button><button class="artifact-row" draggable="true" data-artifact="mobile" data-action="open-mobile"><span class="file-icon">PNG</span><span><b>手机预览.png</b><small>来自当前工作版</small></span></button><div class="group-title">输入参考</div><button class="artifact-row" draggable="true" data-artifact="prd" data-action="board-info"><span class="file-icon">MD</span><span><b>产品需求 PRD.md</b><small>只读引用</small></span></button><button class="artifact-row" draggable="true" data-artifact="shot" data-action="board-info"><span class="file-icon">PNG</span><span><b>视觉参考.png</b><small>只读引用</small></span></button></aside><section class="board-pane"><div class="board-top"><strong>成果画板</strong><span class="stage-label">v${state.version}</span><small>拖动卡片整理 · 点击主稿进入运行预览</small><span class="spacer"></span><button class="outline" data-action="open-canvas">预览主稿</button></div><div class="board-body"><div class="board-grid" id="board-grid">${state.board.map(boardCard).join('')}</div></div><div class="board-hint">HTML 是可编辑源文件；预览图与参考资料可摆放、查看，不直接修改页面 DOM。</div></section></div>`;
  }
  function renderCollab(){
    $('#view-collab').innerHTML=`<div class="collab-wrap"><div class="section-title"><div><h2>协作建议</h2><p>查看同事对版本的意见，决定是否创建修改候选。</p></div><span class="stage-label">${state.comments.filter(c=>c.status==='待处理').length} 条待处理</span></div><div class="version-context"><strong>v${state.version} · 当前工作版</strong><span>AI 产品官网 / 首页<br><small>${state.device==='mobile'?'手机':'桌面'} · ${({default:'默认',error:'错误',success:'成功'})[state.formState]}态 · ${labels[state.selected]||'页面整体'}</small></span><span class="spacer"></span><small>建议固定在提交版本</small></div><div class="collab-grid"><div class="collab-preview"><div class="scope-line">页面预览 · 当前工作版 v${state.version}</div>${sampleMarkup()}<div class="collab-note">历史建议保留原版本，不会随工作版更新而移动。</div></div><div class="suggestion-rail"><h3>建议 · ${state.comments.length}</h3>${state.comments.map((c,i)=>`<article class="suggestion"><div><strong>${escapeHTML(c.role)}</strong><span class="comment-status">${c.status}</span></div><p>${escapeHTML(c.text)}</p><small>v${c.version} · 首页 · ${labels[c.target]||'页面整体'}</small><div class="suggestion-actions"><button class="outline" data-action="comment-candidate" data-index="${i}" ${c.status!=='待处理'||c.version!==state.version?'disabled':''}>${c.version!==state.version?'历史建议':'创建候选'}</button><button class="text-btn" data-action="dismiss-comment" data-index="${i}" ${c.status!=='待处理'?'disabled':''}>暂不采纳</button></div></article>`).join('')}<details class="collab-comment"><summary>邀请与提出建议</summary><label>协作者标识（本地模拟）</label><input id="collab-name" placeholder="输入协作者名称"><button class="outline" data-action="invite-collab">添加到讨论</button><small>${state.invited.map(escapeHTML).join('、')}</small><label>参与者角色</label><select id="collab-role"><option>产品经理</option><option>前端工程师</option><option>设计师</option></select><label>建议对象</label><select id="collab-target"><option value="desc">说明文案</option><option value="title">页面主标题</option><option value="error">错误提示</option><option value="button">主按钮</option></select><label>建议说明</label><textarea id="collab-text" placeholder="描述修改原因"></textarea><label>建议替换的文字</label><input id="collab-value" placeholder="填写候选文字"><button class="primary" data-action="submit-comment">记录建议</button><p class="hint">仅保存到本次本地演示，不发送邀请或消息。</p></details></div></div></div>`;
  }
  function sampleMarkup(){
    const d=displayData();const mobile=state.device==='mobile';const sel=k=>state.selected===k?' active':'';
    return `<div class="sample-page ${mobile?'mobile-page':''}" style="--sample-accent:${escapeHTML(d.accent)}"><div class="sample-copy"><div class="sample-badge">○ &nbsp; NOVA AI</div><h2 class="sample-title editable${sel('title')}" data-element="title">${escapeHTML(d.title)}</h2><p class="sample-desc editable${sel('desc')}" data-element="desc">${escapeHTML(d.desc)}</p></div><div class="sample-form"><strong>申请产品体验</strong><label class="field-label">邮箱地址</label><input class="sample-field" id="preview-email" type="email" value="${escapeHTML(state.previewEmail)}" placeholder="name@company.com" ${state.mode==='preview'?'':'readonly'}><div class="sample-error editable ${state.formState==='error'?'visible':''}${sel('error')}" data-element="error" style="margin-top:${Number(d.errorGap)||0}px">${state.formState==='error'?escapeHTML(d.error):'占位'}</div><button class="sample-submit editable${sel('button')}" data-element="button" type="button">${escapeHTML(d.button)}</button><div class="sample-success">${state.formState==='success'?'✓ 申请已提交':''}</div></div></div>`;
  }
  function renderCanvas(){
 $('#view-canvas').innerHTML=state.candidate?`<div class="canvas-layout"><div class="canvas-main"><div class="candidate-bar">${state.candidateVisible?'候选':'工作版'} · v${state.version}<button data-action="toggle-candidate">切换${state.candidateVisible?'工作版':'候选'}对比</button></div><div class="canvas-surface"><div class="live-wrap" id="live-wrap">${sampleMarkup()}</div></div></div><aside class="inspector"><div class="inspect-head">协作候选审阅</div><div class="inspect-body">${inspectorMarkup()}</div></aside></div>`:`<div class="list-page"><h2>协作候选审阅</h2><p>从建议列表创建候选后，在这里核对修改。评审者不能直接覆盖工作版。</p><button class="primary" data-action="open-collab">返回协作建议</button></div>`;
 }
  function inspectorMarkup(){
    if(state.candidate){const c=state.candidate;return `<span class="target-pill">${escapeHTML(labels[c.target]||'局部区域')} · ${state.device==='mobile'?'手机':'桌面'} / ${({default:'默认',error:'错误',success:'成功'})[state.formState]}</span><div class="field"><label>本次变化</label><div class="scope">${escapeHTML(c.summary)}</div></div><div class="field"><label>修改范围与检查</label><div class="scope">仅修改 index.html 对应对象；本演示没有运行真实回归检查。请人工查看默认、错误、成功态与桌面、手机。</div></div><div class="inspect-actions"><button class="outline" data-action="discard-candidate">放弃</button><button class="primary" data-action="accept-candidate">采纳为 v${state.version+1}</button></div><p class="hint">采纳只更新工作版；交付检查需要重新完成。</p>`}
    if(state.possible.length>1)return `<div class="scope warn">圈选命中了 ${state.possible.length} 个元素。先选一个目标，避免重生成整页。</div>${state.possible.map(k=>`<button class="outline" style="display:block;width:100%;margin-top:9px;text-align:left" data-target="${k}">${escapeHTML(labels[k])}</button>`).join('')}`;
    if(!state.selected)return `<p style="line-height:1.7;color:#66746e;margin-top:0">先在画布中选择文字或按钮；也可以圈选一个区域。Agent 会把“改哪里”和“保留什么”带入修订。</p><div class="scope">当前上下文：AI 产品官网首页 / ${state.device==='mobile'?'手机':'桌面'} / ${{default:'默认',error:'错误',success:'成功'}[state.formState]}态 / v${state.version}</div><p class="hint">可编辑对象来自 HTML。图片和参考资料可查看与替换，不能假装成可修改的 DOM。</p>`;
    const k=state.selected;const d=state.base;const textTarget=['title','desc','button','error'].includes(k);
    return `<span class="target-pill">已命中：${escapeHTML(labels[k])}</span><div class="field"><label>修改范围</label><div class="scope">仅此 HTML 节点 · 基线 v${state.version}<br>共享样式可能影响其他状态；采纳前需检查。</div></div>${textTarget?`<div class="field"><label>文字内容</label><textarea id="edit-text">${escapeHTML(d[k])}</textarea></div>`:''}${k==='button'?`<div class="field"><label>按钮颜色</label><input type="color" id="edit-color" value="${escapeHTML(d.accent)}"></div>`:''}${k==='error'?`<div class="field"><label>与输入框间距 · px</label><input type="number" id="edit-gap" min="0" max="32" value="${Number(d.errorGap)}"></div>`:''}<div class="field"><label>可选：给 Agent 的局部修改意图</label><textarea id="edit-prompt" placeholder="例如：错误提示靠近输入框，其他状态不变">${escapeHTML(state.prompt)}</textarea></div><div class="scope">保持不变：其他文字、页面结构、未选中状态。</div><div class="inspect-actions"><button class="primary" data-action="create-candidate">生成局部候选</button></div><p class="hint">原型中只演示本地确定值修改。自然语言理解、源码定位与影响分析需要接入真实 Agent。</p>`;
  }
  function renderFiles(){
    $('#view-files').innerHTML=`<div class="list-page"><h2>本任务的成果文件</h2><p>按用途组织，始终关联同一个任务和版本。图片是参考或导出物；HTML 才是本次可运行主稿。</p><div class="group-title">可编辑主稿</div><div class="file-row"><span class="file-icon">HTML</span><div><strong>index.html</strong><small>当前工作版 v${state.version} · 页面与交互的权威源</small></div><span class="spacer"></span><button class="outline" data-action="open-canvas">打开预览</button></div><div class="group-title">参考资料 · 只读</div><div class="file-row"><span class="file-icon">MD</span><div><strong>PRD.md</strong><small>需求与文案依据 · 用于引用和评审</small></div><span class="spacer"></span><span class="file-tag">参考</span></div><div class="file-row"><span class="file-icon">PNG</span><div><strong>参考截图.png</strong><small>原始截图 · 不具备 DOM 编辑能力</small></div><span class="spacer"></span><span class="file-tag">参考</span></div><div class="group-title">派生输出</div><div class="file-row"><span class="file-icon">HTML</span><div><strong>AI 产品官网首页 · 可运行交付稿</strong><small>由 v${state.version} 派生 · 可单独打开</small></div><span class="spacer"></span><button class="outline" data-action="download-html">下载 HTML</button></div></div>`;
  }
  function renderVersions(){
 $('#view-versions').innerHTML=`<div class="list-page"><h2>评审记录</h2><p>仅展示测试2的建议与采纳记录，和测试1的生成版本互相独立。</p><div class="scope">评审基准 v1 · 当前工作版 v${state.version}</div>${state.comments.map(c=>`<div class="file-row"><div><strong>${escapeHTML(c.role)} · ${c.status}</strong><small>固定在 v${c.version} · ${escapeHTML(c.text)}</small></div></div>`).join('')}<button class="primary" style="margin-top:24px" data-action="export-review">下载评审记录</button></div>`;
 }
  function exportHTML(){const d=state.base;const css=`body{margin:0;font-family:PingFang SC,Arial,sans-serif;background:#fafafa;color:#333333}.page{min-height:100vh;display:flex;justify-content:center;align-items:center;gap:50px;padding:30px}.copy{max-width:360px}h1{font-size:34px}p{color:#777777;line-height:1.6}.card{width:280px;background:white;border:1px solid #e9e9e9;border-radius:10px;padding:24px;box-shadow:0 10px 30px #0000000a}label{display:block;margin:20px 0 5px;font-size:13px}input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #e9e9e9;border-radius:5px}.error{color:#c7554e;font-size:12px;margin-top:${Number(d.errorGap)||0}px;min-height:18px}button{width:100%;background:${d.accent};color:white;border:0;padding:11px;border-radius:5px;margin-top:8px;cursor:pointer}.success{color:#0f8a61;font-size:12px;min-height:18px}@media(max-width:650px){.page{display:block}.card{width:auto;margin-top:30px}}`;
    return `<!doctype html>\n<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 产品官网首页</title><style>${css}</style><main class="page"><div class="copy"><small>NOVA AI</small><h1>${escapeHTML(d.title)}</h1><p>${escapeHTML(d.desc)}</p></div><form class="card" id="invite" novalidate><strong>申请产品体验</strong><label for="email">邮箱地址</label><input id="email" type="email" placeholder="name@company.com"><div class="error" id="error"></div><button>${escapeHTML(d.button)}</button><div class="success" id="success"></div></form></main><script>document.querySelector('#invite').addEventListener('submit',function(e){e.preventDefault();var v=document.querySelector('#email').value;var ok=/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(v);document.querySelector('#error').textContent=ok?'':${JSON.stringify(d.error).replace(/</g,'\\u003c')};document.querySelector('#success').textContent=ok?'申请已提交':''});</${'script'}></html>`;
  }
  function renderCode(){$('#view-code').innerHTML=`<div class="list-page"><h2>主稿源码</h2><p>预览和交付均以同一份 HTML 为准。这里展示当前工作版；候选采纳前不会写入主稿。</p><pre class="code-block">${escapeHTML(exportHTML())}</pre></div>`}
  function download(name,content,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
  function createCandidate(){
    const k=state.selected;if(!k){toast('请先选中一个 HTML 元素');return}const d={...state.base};let change=[];
    const inp=$('#edit-text');if(inp&&inp.value.trim()!==d[k]){d[k]=inp.value.trim();change.push(`${labels[k]}文字已调整`)}
    const color=$('#edit-color');if(color&&color.value!==d.accent){d.accent=color.value;change.push('按钮颜色已调整')}
    const gap=$('#edit-gap');if(gap&&Number(gap.value)!==d.errorGap){d.errorGap=Math.max(0,Math.min(32,Number(gap.value)||0));change.push('错误提示间距已调整')}
    const prompt=$('#edit-prompt');state.prompt=prompt?.value.trim()||'';
    if(!change.length&&state.prompt){if(k==='error'){d.errorGap=Math.max(0,d.errorGap-2);change.push('演示规则：错误提示向输入框靠近 2px')}else{toast('此演示只支持确定值修改；请编辑文字或属性');return}}
    if(!change.length){toast('请先修改文字或属性');return}
    state.candidate={data:d,target:k,summary:change.join('；')};state.candidateVisible=true;render();toast('已生成隔离候选，工作版未被覆盖');
  }
  function selectTarget(k){state.selected=k;state.possible=[];state.mode='select';state.prompt='';render()}
  function sendMessage(){const input=$('#chat-input');const value=input.value.trim();if(!value)return;const hasTarget=!!state.selected;state.messages.push({user:value,reply:hasTarget?`已记录你对「${labels[state.selected]}」的要求。请在右侧确认具体属性与保留范围，再创建局部候选。`:'已收到。为了避免重做整页，请先在右侧选择 HTML 元素或圈出区域，再限定本次修改。',cta:true});if(hasTarget)state.prompt=value;input.value='';render();$('#stream').scrollTop=$('#stream').scrollHeight}
  document.addEventListener('click',e=>{
    const view=e.target.closest('[data-view]');if(view){setView(view.dataset.view);return}
    const target=e.target.closest('[data-target]');if(target){selectTarget(target.dataset.target);return}
    const mobile=e.target.closest('[data-mobile]');if(mobile){state.mobile=mobile.dataset.mobile;$('#app').className='app mobile-'+state.mobile;renderMobile();return}
    const device=e.target.closest('[data-device]');if(device){state.device=device.dataset.device;renderCanvas();return}
    const mode=e.target.closest('[data-mode]');if(mode){state.mode=mode.dataset.mode;state.brush=null;renderCanvas();return}
    const st=e.target.closest('[data-state]');if(st){state.formState=st.dataset.state;renderCanvas();return}
    const el=e.target.closest('[data-element]');if(el&&state.mode==='select'&&state.view==='canvas'){selectTarget(el.dataset.element);return}
    if(el&&el.dataset.element==='button'&&state.mode==='preview'){state.previewEmail=$('#preview-email')?.value||'';state.formState=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(state.previewEmail)?'success':'error';renderCanvas();return}
    const board=e.target.closest('[data-board-id]');if(board){const a=artifacts[board.dataset.boardId];if(a?.action==='open-mobile'){state.device='mobile';setView('canvas')}else if(a?.action==='open-canvas')setView('canvas');else document.querySelector('[data-artifact=prd]').click();return}
    const a=e.target.closest('[data-action]');if(!a)return;
    switch(a.dataset.action){
      case 'reset-demo':location.reload();break;case 'comment-candidate':{if(state.candidate){toast('请先处理当前候选');break}const i=Number(a.dataset.index),c=state.comments[i];if(c.version!==state.version){toast('此建议固定在历史版本；请核对当前工作版后重新提出');break}state.selected=c.target||'desc';state.candidate={data:{...state.base,[state.selected]:c.value||c.text},target:state.selected,summary:'根据'+c.role+'的建议调整'+labels[state.selected],commentIndex:i};state.candidateVisible=true;setView('canvas');break}case 'dismiss-comment':state.comments[Number(a.dataset.index)].status='暂不采纳';renderCollab();break;case 'view-history':{const h=state.history[Number(a.dataset.index)];$('#view-code').innerHTML='<div class="list-page"><h2>历史快照 v'+h.version+'</h2><p>只读查看，当前工作版保持不变。</p><pre class="code-block">'+escapeHTML(JSON.stringify(h.data,null,2))+'</pre></div>';state.view='code';$$('.view').forEach(v=>v.classList.toggle('active',v.id==='view-code'));break}case 'export-review':download('测试2_评审记录.json',JSON.stringify({task:'测试2',baseline:1,currentVersion:state.version,comments:state.comments,participants:state.invited},null,2),'application/json');toast('已下载本地评审记录');break;case 'open-task':state.mobile='task';$('#app').className='app mobile-task';renderMobile();break;
      case 'open-canvas':setView('canvas');break;
      case 'open-files':case 'open-overview':setView('collab');break;
      case 'open-collab':setView('collab');break;
      case 'open-mobile':state.device='mobile';setView('canvas');break;
      case 'board-info':{const dialog=document.createElement('dialog');dialog.id='task-dialog';dialog.innerHTML='<h2>输入参考 · 只读</h2><p>AI 产品官网首页 · 示例 PRD</p><ul><li>目标：帮助访客理解产品价值并申请体验。</li><li>页面：品牌、主标题、说明与邮箱申请表单。</li><li>覆盖桌面 / 手机，默认 / 错误 / 成功状态。</li><li>保持浅灰、白色、深色按钮与清晰层级。</li></ul><p class="hint">参考资料用于评审与对照；可运行主稿为 index.html。</p><button class="primary" data-action="close-dialog">关闭</button>';document.body.append(dialog);dialog.showModal();break}
      case 'invite-collab':{const n=$('#collab-name')?.value.trim();if(!n){toast('请先填写协作者标识');break}state.invited.push(n);renderCollab();toast('已添加到本地讨论演示');break}
      case 'submit-comment':{const t=$('#collab-text')?.value.trim();if(!t){toast('请先填写建议');break}state.comments.push({role:$('#collab-role')?.value||'协作者',text:t,version:state.version,target:$('#collab-target')?.value||'desc',value:$('#collab-value')?.value.trim()||'',status:'待处理'});renderCollab();toast('建议已记录在当前版本');break}
      case 'open-versions':setView('versions');break;
      case 'nav-info':toast('演示聚焦当前 Design 任务');break;
      case 'new-task':{const dialog=document.createElement('dialog');dialog.id='task-dialog';dialog.innerHTML='<h2>新建设计任务</h2><p>从需求与参考资料开始，生成可继续编辑的产物。</p><label>任务描述<textarea id="brief-input">根据 PRD 和参考截图，生成 AI 产品官网首页的 HTML Demo，并整理相关产物。</textarea></label><div class="brief-files"><span>PRD.md · 示例需求</span><span>视觉参考.png · 示例参考</span></div><p class="hint">本地演示使用固定示例资料，未接入真实 Agent。</p><div class="dialog-actions"><button class="outline" data-action="close-dialog">取消</button><button class="primary" data-action="generate-task">生成示例初稿</button></div>';document.body.append(dialog);dialog.showModal();break}case 'close-dialog':$('#task-dialog')?.remove();break;case 'generate-task':{const brief=$('#brief-input').value.trim();if(!brief){toast('请填写任务描述');break}$('#task-dialog').remove();state.messages.push({user:brief,reply:'示例初稿与关联产物已准备好。打开产物工作区，继续预览与局部编辑。',cta:true});setView('collab');toast('示例产物已生成');break}
      case 'send-message':{const t=$('#chat-input').value.trim();if(t){state.reviewNotes.push(t);$('#chat-input').value='';renderStream();$('#stream').scrollTop=1e9}break}
      case 'create-candidate':createCandidate();break;
      case 'toggle-candidate':state.candidateVisible=!state.candidateVisible;renderCanvas();break;
      case 'discard-candidate':state.candidate=null;state.candidateVisible=true;render();toast('已放弃候选，工作版未改变');break;
      case 'accept-candidate':if(state.candidate){state.history.push({version:state.version,data:{...state.base}});if(state.candidate.commentIndex!==undefined)state.comments[state.candidate.commentIndex].status='已采纳';state.base=state.candidate.data;state.candidate=null;state.version++;state.concept=false;state.demo=false;state.handed=false;state.selected=null;render();toast(`已采纳为工作版 v${state.version}；交付检查需重新确认`)}break;
      case 'download-html':if(!state.concept||!state.demo||state.candidate){toast('请处理候选并完成当前版本的两项检查');setView('versions');break}state.handed=true;renderVersions();download(`ai-product-home-v${state.version}.html`,exportHTML(),'text/html;charset=utf-8');toast('已下载当前工作版 HTML');break;
      case 'download-note':download(`handoff-v${state.version}.md`,`# AI 产品官网首页 · 交付说明\n\n- 版本：v${state.version}\n- 主稿：ai-product-home-v${state.version}.html\n- 状态：默认、错误、成功\n- 设备：桌面、手机\n- G1：源文件与资源完整性检查\n- G2：桌面/手机与多状态体验复核\n- 待开发验证：真实接口、路由、权限、可访问性与错误处理\n- 说明：此包由交互原型导出，并非真实 AutoClaw Agent 产物。\n`,'text/markdown;charset=utf-8');toast('已下载交付说明');break;
    }
  });
  document.addEventListener('change',e=>{if(e.target.id==='concept-check'){state.concept=e.target.checked;state.demo=false;renderVersions()}if(e.target.id==='demo-check'){state.demo=e.target.checked;renderVersions()}});
  document.addEventListener('input',e=>{if(e.target.id==='preview-email')state.previewEmail=e.target.value;if(e.target.id==='artifact-search'){const q=e.target.value.trim().toLowerCase();document.querySelectorAll('.artifact-rail .artifact-row').forEach(row=>row.hidden=!row.textContent.toLowerCase().includes(q))}});
  $('#chat-input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});
  document.addEventListener('pointerdown',e=>{if(e.target.id!=='brush-overlay')return;const wrap=$('#live-wrap');const r=wrap.getBoundingClientRect();state.brush={x:e.clientX-r.left,y:e.clientY-r.top};e.target.setPointerCapture(e.pointerId);const box=document.createElement('div');box.className='brush-box';box.id='brush-box';e.target.append(box)});
  document.addEventListener('pointermove',e=>{if(!state.brush)return;const wrap=$('#live-wrap');const r=wrap.getBoundingClientRect();const x=e.clientX-r.left,y=e.clientY-r.top;const box=$('#brush-box');if(!box)return;Object.assign(box.style,{left:Math.max(0,Math.min(state.brush.x,x))+'px',top:Math.max(0,Math.min(state.brush.y,y))+'px',width:Math.abs(x-state.brush.x)+'px',height:Math.abs(y-state.brush.y)+'px'})});
  document.addEventListener('pointerup',e=>{if(!state.brush)return;const b=$('#brush-box')?.getBoundingClientRect();state.brush=null;if(!b||b.width<8||b.height<8){toast('请拖拽框出要修改的区域');return}const hits=$$('[data-element]',$('#live-wrap')).filter(el=>{const r=el.getBoundingClientRect();return Math.max(0,Math.min(b.right,r.right)-Math.max(b.left,r.left))*Math.max(0,Math.min(b.bottom,r.bottom)-Math.max(b.top,r.top))>40}).map(el=>el.dataset.element);state.possible=[...new Set(hits)];state.selected=state.possible.length===1?state.possible[0]:null;state.mode='select';renderCanvas();if(!hits.length)toast('未映射到 HTML 元素；请点选具体对象');else if(hits.length>1)toast('圈选了多个元素，请在右侧指定一个')});
  document.addEventListener('dragstart',e=>{const node=e.target.closest('[data-artifact],[data-board-id]');if(!node)return;e.dataTransfer.setData('text/plain',node.dataset.artifact||node.dataset.boardId);e.dataTransfer.effectAllowed='move'});
  document.addEventListener('dragover',e=>{if(e.target.closest('#board-grid'))e.preventDefault()});
  document.addEventListener('drop',e=>{const grid=e.target.closest('#board-grid');if(!grid)return;e.preventDefault();const id=e.dataTransfer.getData('text/plain');if(!artifacts[id])return;const r=grid.getBoundingClientRect();const x=Math.max(4,Math.min(grid.clientWidth-185,e.clientX-r.left));const y=Math.max(4,Math.min(grid.clientHeight-105,e.clientY-r.top));const existing=state.board.find(i=>i.id===id);if(existing){existing.x=x;existing.y=y}else state.board.push({id,x,y});renderOverview();toast('已放到成果画板')});
  render();
})();
</script>
