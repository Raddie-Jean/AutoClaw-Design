<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080"><rect x="0" y="0" width="1440" height="1080" rx="0" fill="#fff"/><text x="64" y="60" fill="#777777" font-family="PingFang SC" font-weight="400" font-size="12">AUTOCLAW  /  DESIGN FOUNDATION</text><text x="64" y="118" fill="#333333" font-family="PingFang SC" font-weight="600" font-size="32">布局模板与区域关系</text><text x="64" y="152" fill="#777777" font-family="PingFang SC" font-weight="400" font-size="14">参考画板 1512×945；下方以 0.4 倍缩略展示，标注仍是逻辑 px。</text><path d="M64 180L1376 180" stroke="#eee"/><path d="M64 1020L1376 1020" stroke="#eee"/><text x="64" y="1050" fill="#999999" font-family="PingFang SC" font-weight="400" font-size="12">V10 · 2026-10-12  |  基于基础设计规范 V09 · 浅色桌面工作区</text><text x="1250" y="1050" fill="#777777" font-family="PingFang SC" font-weight="400" font-size="12">04 / 07</text><rect x="64" y="245" width="605" height="378" rx="12" fill="#f7f7f7" stroke="#eee" stroke-width="1"/><rect x="176" y="245" width="493" height="378" rx="10" fill="#fff"/><text x="88" y="287" fill="#333333" font-family="PingFang SC" font-weight="400" font-size="13">侧栏</text><text x="88" y="312" fill="#999999" font-family="PingFang SC" font-weight="400" font-size="12">280</text><rect x="269" y="390" width="307" height="56" rx="14" fill="#fff" stroke="#e9e9e9" stroke-width="1"/><text x="300" y="424" fill="#333333" font-family="PingFang SC" font-weight="400" font-size="13">首页输入框 · 768×140</text><rect x="771" y="245" width="605" height="378" rx="12" fill="#f7f7f7" stroke="#eee" stroke-width="1"/><rect x="883" y="245" width="493" height="378" rx="10" fill="#fff"/><text x="795" y="287" fill="#333333" font-family="PingFang SC" font-weight="400" font-size="13">侧栏</text><text x="795" y="312" fill="#999999" font-family="PingFang SC" font-weight="400" font-size="12">280</text><path d="M1051 245L1051 623" stroke="#eee"/><text x="903" y="287" fill="#333333" font-family="PingFang SC" font-weight="400" font-size="13">对话区</text><text x="903" y="312" fill="#999999" font-family="PingFang SC" font-weight="400" font-size="12">420</text><rect x="893" y="560" width="148" height="43" rx="12" fill="#fff" stroke="#e9e9e9" stroke-width="1"/><text x="1071" y="287" fill="#333333" font-family="PingFang SC" font-weight="400" font-size="13">预览区 812</text><text x="64" y="220" fill="#333333" font-family="PingFang SC" font-weight="600" font-size="20">01 / 首页</text><text x="771" y="220" fill="#333333" font-family="PingFang SC" font-weight="600" font-size="20">02 / 对话 + 预览</text><rect x="64" y="657" width="605" height="300" rx="12" fill="#f7f7f7" stroke="#eee" stroke-width="1"/><rect x="176" y="657" width="493" height="300" rx="10" fill="#fff"/><text x="88" y="699" fill="#333333" font-family="PingFang SC" font-weight="400" font-size="13">侧栏</text><text x="88" y="724" fill="#999999" font-family="PingFang SC" font-weight="400" font-size="12">280</text><path d="M483 657L483 957" stroke="#eee"/><text x="196" y="699" fill="#333333" font-family="PingFang SC" font-weight="400" font-size="13">对话区</text><text x="196" y="724" fill="#999999" font-family="PingFang SC" font-weight="400" font-size="12">768</text><rect x="186" y="894" width="287" height="43" rx="12" fill="#fff" stroke="#e9e9e9" stroke-width="1"/><text x="503" y="699" fill="#333333" font-family="PingFang SC" font-weight="400" font-size="13">编辑区 464</text><path d="M581 693L581 957" stroke="#eee"/><text x="586" y="747" fill="#999999" font-family="PingFang SC" font-weight="400" font-size="10">文件树</text><text x="64" y="645" fill="#333333" font-family="PingFang SC" font-weight="600" font-size="16">03 / 对话 + 代码</text><text x="771" y="700" fill="#333333" font-family="PingFang SC" font-weight="600" font-size="20">布局约束</text><text x="771" y="746" fill="#777777" font-family="PingFang SC" font-weight="400" font-size="15">首页内容在工作区居中，不在整张画板居中。</text><text x="771" y="782" fill="#777777" font-family="PingFang SC" font-weight="400" font-size="15">首页内容最大宽 768；侧栏固定宽