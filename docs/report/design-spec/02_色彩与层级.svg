ingFang SC" font-weight="400" font-size="14">增加计数</text><text x="960" y="777" fill="#777777" font-family="Menlo" font-weight="400" font-size="12">#39A355</text><text x="960" y="802" fill="#999999" font-family="Menlo" font-weight="400" font-size="10">primitive.color.positive</text></g><g id="Color-negative"><rect x="1184" y="632" width="192" height="88" rx="12" fill="#FB5252"/><text x="1184" y="750" fill="#333333" font-family="PingFang SC" font-weight="400" font-size="14">删除计数</text><text x="1184" y="777" fill="#777777" font-family="Menlo" font-weight="400" font-size="12">#FB5252</text><text x="1184" y="802" fill="#999999" font-family="Menlo" font-weight="400" font-size="10">primitive.color.negative</text></g><rect x="64" y="855" width="1312" height="115" rx="14" fill="#f7f7f7"/><text x="88" y="891" fill="#333333" font-family="PingFang SC" font-weight="600" font-size="16">使用规则</text><text x="88" y="921" fill="#777777" font-family="PingFang SC" font-weight="400" font-size="13">购买橙色只用于付费语义；链接与技能状态用蓝色。不要让品牌色淹没工作内容。</text><text x="88" y="946" fill="#777777" font-family="PingFang SC" font-weight="400" font-size="13">弱灰不用于关键正文或关键操作；增删信息同时保留 + / − 符号。</text></svg>