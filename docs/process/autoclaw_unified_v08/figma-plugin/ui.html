<!doctype html><meta charset="utf-8"><style>body{font:14px sans-serif;padding:16px;line-height:1.6;color:#333}input{width:100%;margin:10px 0}p{color:#777;font-size:12px}</style><b>导入界面与可编辑文字</b><p>选择素材包 figma-editable-import 文件夹中的 JSON。文件仅在本地处理。</p><input id="f" type="file" accept=".json"><p id="status"></p><script>document.getElementById('f').onchange=async e=>{try{let data=JSON.parse(await e.target.files[0].text());document.getElementById('status').textContent='正在导入…';parent.postMessage({pluginMessage:{type:'import',data}},'*')}catch(e){document.getElementById('status').textContent=e.message}};onmessage=e=>{if(e.data.pluginMessage)document.getElementById('status').textContent=e.data.pluginMessage.message}</script>
