<text x="605" y="426" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="24" font-weight="400" fill="#60716F" text-anchor="start">在原方向上连续局部修订</text>
<text x="605" y="472" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="24" font-weight="400" fill="#60716F" text-anchor="start">PM 与设计师持续讨论</text>
