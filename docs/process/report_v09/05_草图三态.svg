<text x="1115" y="293" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">03</text>
<text x="1162" y="296" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="31" font-weight="700" fill="#17383B" text-anchor="start">概念确定</text>
<text x="1091" y="380" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="24" font-weight="400" fill="#60716F" text-anchor="start">确认核心路径与设计原则</text>
<text x="1091" y="426" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="24" font-weight="400" fill="#60716F" text-anchor="start">记录拒绝理由和未决问题</text>
<text x="1091" y="472" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="24" font-weight="400" fill="#60716F" text-anchor="start">必要时请开发做技术预检</text>
