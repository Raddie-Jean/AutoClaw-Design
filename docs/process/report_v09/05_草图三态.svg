<text x="119" y="380" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="24" font-weight="400" fill="#60716F" text-anchor="start">PRD 片段、参考、手绘、</text>
<text x="119" y="426" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="24" font-weight="400" fill="#60716F" text-anchor="start">未尝试概念与 AI 生成物</text>
