<text x="629" y="293" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="23" font-weight="700" fill="#12877D" text-anchor="middle">02</text>
<text x="676" y="296" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="31" font-weight="700" fill="#17383B" text-anchor="start">定义概念</text>
