<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AutoClaw · 响应式交互实验室</title><style>*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#eeefef;color:#333;font:13px -apple-system,'PingFang SC',sans-serif}button,select,input{font:inherit}button,select{border:1px solid #ddd;background:white;border-radius:7px;padding:8px 12px;color:inherit;cursor:pointer}button:hover{background:#f1f1f1}button.active{background:#292929;color:white;border-color:#292929}header{height:58px;background:white;border-bottom:1px solid #ddd;display:flex;align-items:center;padding:0 20px;gap:10px}header strong{margin-right:auto}header small{color:#999}main{display:flex;height:calc(100dvh - 58px)}.stage{flex:1;min-width:0;overflow:auto;padding:22px;display:flex;align-items:flex-start;justify-content:center}iframe{width:100%;background:white;border:1px solid #ddd;border-radius:12px;flex-shrink:0;height:calc(100dvh - 104px);box-shadow:0 10px 35px #00000008}aside{width:280px;flex-shrink:0;background:#fff;border-left:1px solid #ddd;overflow:auto;padding:20px}h2{font-size:14px;margin:0 0 20px}h3{font-size:12px;color:#888;margin:24px 0 12px}label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:14px 0}select{max-width:158px}input[type=range]{width:125px;accent-color:#333}input[type=number]{width:80px;border:1px solid #ddd;padding:7px;border-radius:6px}p{line-height:1.7;color:#888;font-size:12px}.log{border-top:1px solid #eee;margin-top:20px;padding-top:12px;font-size:12px;color:#777;line-height:1.8}#reset{width:100%;margin-top:20px}@media(max-width:760px){header{padding:8px;height:auto;flex-wrap:wrap}header small{display:none}main{height:calc(100dvh - 90px);flex-direction:column}aside{width:100%;height:230px;border-top:1px solid #ddd;display:flex;flex-wrap:wrap;gap:12px;padding:12px}aside h2,aside h3,aside p,.log{display:none}label{margin:0}iframe{height:650px}.stage{min-height:250px}#reset{width:auto;margin:0}}</style><header><strong>AutoClaw <small> / 交互实验室</small></strong><button data-size="auto" class="active">自适应</button><button data-size="1512">桌面</button><button data-size="834">平板</button><button data-size="390">手机</button><button id="inspect">收起参数</button></header><main><section class="stage"><iframe title="AutoClaw 实时界面" src="app.html"></iframe></section><aside><h2>组件与交互参数</h2><label>界面<select id="view"><option value="home">任务首页</option><option value="execution">任务执行 / 代码</option><option value="preview">任务执行 / 预览</option></select></label><label>任务状态<select id="state"><option value="idle">默认</option><option value="running">执行中</option><option value="done">完成</option><option value="error">失败</option><option value="empty">空状态</option></select></label><h3>布局参数</h3><label>侧栏宽度<input id="sidebar" type="range" min="200" max="320" value="280"></label><label>文件树宽度<input id="tree" type="range" min="150" max="260" value="220"></label><label>输入框圆角<input id="radius" type="range" min="0" max="32" value="25"></label><label>正文字号<input id="font" type="range" min="12" max="18" value="14"></label><h3>组件状态</h3><label>输入框<select id="inputState"><option value="default">默认</option><option value="focus">聚焦</option><option value="disabled">禁用</option><option value="error">错误</option></select></label><label>按钮<select id="buttonState"><option value="default">默认</option><option value="hover">悬停</option><option value="disabled">禁用</option><option value="loading">加载</option></select></label><label>显示文件树<input id="files" type="checkbox" checked></label><label>收起导航<input id="collapsed" type="checkbox"></label><button id="reset">重置全部参数</button><p>布局参数为可调整的模拟值。页面操作与右侧状态双向同步；所有内容均为本地交互模拟。</p><div class="log" aria-live="polite">等待操作…</div></aside></main><script>const frame=document.querySelector('iframe'),fields=[...document.querySelectorAll('aside input,aside select')];function send(){document.querySelectorAll('input[type=range]').forEach(x=>{x.title=x.value+' px';let o=x.parentElement.querySelector('output');if(!o){o=document.createElement('output');x.parentElement.append(o)}o.textContent=x.value});frame.contentWindow.postMessage({type:'config',config:Object.fromEntries(fields.map(x=>[x.id,x.type==='checkbox'?x.checked:x.value]))},'*')}fields.forEach(x=>x.addEventListener('input',send));frame.addEventListener('load',send);document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-size]').forEach(x=>x.classList.toggle('active',x===b));frame.style.width=b.dataset.size==='auto'?'100%':b.dataset.size+'px';document.querySelector('.log').textContent='预览宽度：'+(b.dataset.size==='auto'?'跟随窗口':b.dataset.size+' px')});document.querySelector('#inspect').onclick=()=>{const a=document.querySelector('aside');a.hidden=!a.hidden;document.querySelector('#inspect').textContent=a.hidden?'展开参数':'收起参数'};document.querySelector('#reset').onclick=()=>location.reload();window.addEventListener('message',e=>{if(e.source!==frame.contentWindow)return;if(e.data.type==='event'){document.querySelector('.log').textContent=new Date().toLocaleTimeString()+' · '+e.data.text;if(e.data.view)document.querySelector('#view').value=e.data.view;if(e.data.state)document.querySelector('#state').value=e.data.state}});</script></html>
