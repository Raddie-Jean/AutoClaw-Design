ze="22" font-weight="400" fill="#24404B" text-anchor="start">位图选区内部与边缘仍需人审；视频跨帧编辑暂缓</text><text x="72" y="1338" font-family="PingFang SC, PingFang TC, Arial, sans-serif" font-size="22" font-weight="400" fill="#5E7480" text-anchor="start">原则：候选先预览，设计师采纳后才推进概念版本；PM 在概念确认时参与决策。</text></svg>