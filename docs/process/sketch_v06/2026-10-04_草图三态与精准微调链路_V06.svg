<svg xmlns="http://www.w3.org/2000/svg" width="2280" height="1370" viewBox="0 0 2280 1370"><rect x="0" y="0" width="2280" height="1370" rx="0" fill="#F5F8F7"/><rect x="0" y="0" width="2280" height="12" rx="0" fill="#087F7D"/><text x="72" y="96" font-family="PingFang SC, PingFang TC, Arial, sans-serif" font-size="49" font-weight="700" fill="#173340" text-anchor="start">草图三态 × 可累积精准微调</text><text x="72" y="148" font-family="PingFang SC, PingFang TC, Arial, sans-serif" font-size="25" font-weight="400" fill="#5E7480" text-anchor="start">先保留可能性，再选 1–3 个方向深化；概念确认后才进入运行体验。</text><rect x="1920" y="87" width="288" height="56" rx="28" fill="#E7F4F0"/><text x="2064" y="124" font-family="PingFang SC, PingFang TC, Arial, sans-serif" font-size="21" font-weight="600" fill="#087F7D" text-anchor="middle">V06 · 讨论稿</text><rect x="72" y="217" width="506" height="288" rx="18" fill="#FFFFFF" stroke="#D5E3E1" stroke-width="2"/><rect x="72" y="217" width="506" height="11" rx="5" fill="#087F7D"/><text x="100" y="278" font-family="PingFang SC, PingFang TC, Arial, sans-serif" font-size="31" font-weight="700" fill="#173340" text-anchor="start">01  草图收集</text><text x="100" y="331" font-family="PingFang SC, PingFang TC, Arial, sans-serif" font-size="23" font-weight="400" fill="#24404B" text-anchor="start">资料、参考、未试概念</text><text x="100" y="370" font-family="PingFang SC, PingFang TC, Arial, sans-serif" font-size="23" font-weight="400" fill="#24404B" text-anchor="start">自由发散并保留来源</text><rect x="96" y="423" width="458" height="54" rx="12" fill="#E7F4F0"/><text x="112" y="459" font-family="PingFang SC, PingFang TC, Arial, sans-serif" font-size="22" font-weight="600" fill="#087F7D" text-anchor="start">不需要批准</text><rect x="615" y="217" width="506" height="288" rx="18" fill="#FFFFFF" stroke="#D5E3E1" stroke-width="2"/><rect x="615" y="217" width="506" height="11" rx="5" fill="#087F7D"/><text x="643" y="278" font-family="PingFang SC, PingFang TC, Arial, sans-serif" font-size="31" font-weight="700" fill="#173340" text-anchor="start">02  定义概念</text><text x="643" y="331" font-family="PingFang SC, PingFang TC, Arial, sans-serif" font-size="23" font-weight="400" fill="#24404B" text-anchor="start">选出 1–3 个方向</text><text x="643" y="370" font-family="PingFang SC, PingFang TC, Arial, sans-serif" font-size="23" font-weight="400" fill="#24404B" text-anchor="start">局部精修、并排比较</text><rect x="639" y="423" width="458" height="54" rx="12" fill="#E7F4F0"/><text x="655" y="459" font-family="PingFang SC, PingFang TC, Arial, sans-serif" font-size="22" font-weight="600" fill="#087F7D" text-anchor="start">允许细节继续变化</text><rect x="1158" y="217" width="506" height="288" rx="18" fill="#FFFFFF" stroke="#D5E3E1" stroke-width="2"/><rect x="1158" y="217" width="506" height="11" rx="5" fill="#B57635"/><text x="1186" y="278" font-family="PingFang SC, PingFang TC, Arial, sans-serif" font-size="31" font-weight="700" fill="#173340" text-anchor="start">03  概念确定</text><text x="1186" y="331" font-family="PingFang SC, PingFang TC, Arial, sans-serif" font-size="23" font-weight="400" fill="#24404B" text-anchor="start">PM + 设计师共同确认</text><text x="1186" y="370" font-family="PingFang SC, PingFang TC, Arial, sans-serif" font-size="23" font-weight="400" fill="#24404B" text-anchor="start">记录保留原则与待验证点</text><rect x="1182" y="423" width="458" height="54" rx="12" fill="#FFF3E6"/><text x="1198" y="459" font-family="PingFang SC, PingFang TC, Arial, sans-serif" font-size="22" font-weight="600" fill="#B57635" text-anchor="start">G1 概念确认</text><rect x="1701" y="217" width="506" height="288" rx="18" fill="#FFFFFF" stroke="#D5E3E1" stroke-width="2"/><rect x="1701" y="217" width="506" height="11" rx="5" fill="#087F7D"/><text x="1729" y="278" font-family="PingFang SC, PingFang TC, Arial, sans-serif" font-size="31" font-weight="700" fill="#173340" text-anchor="start">04  Demo 体验</text><text x="1729" y="331" font-family="PingFang SC, PingFang TC, Arial, sans-serif" font-size="23" font-weight="400" fill="#24404B" text-anchor=