<meta charset="utf-8"><style>body{font:13px sans-serif;padding:20px;color:#333}button{background:#292929;color:white;border:0;border-radius:8px;padding:12px 18px}p{line-height:1.6;color:#777}</style><b>导入原生可编辑设计稿</b><p>选择「Figma原生图层」中的 JSON。文字、矩形、图层分组将重建为原生对象，图标保留矢量。</p><input id="file" type="file" accept=".json"><p id="status">无需联网，可分别导入两张界面。</p><script>document.getElementById('file').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());document.getElementById('status').textContent='正在重建图层…';parent.postMessage({pluginMessage:{type:'import',data}},'*')}catch(e){document.getElementById('status').textContent=e.message}};onmessage=e=>{document.getElementById('status').textContent=e.data.pluginMessage?.message||''};</script>
