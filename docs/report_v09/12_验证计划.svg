<text x="255" y="688" font-family="'PingFang SC','Noto Sans SC',sans-serif" font-size="24" font-weight="400" fill="#FFFFFF" text-anchor="start">AI 负责生成候选与提示影响；设计师、PM、开发围绕同一版本作出不同阶段的决定。</text>
